name: Import and validate 300-entry pilot

# Generated data/diagnostics are intentionally absent from the push path filter.
# Do not use [skip ci] on diagnostics commits: it can suppress a batched code push.

on:
  workflow_dispatch:
    inputs:
      print_random:
        description: Number of random entries to print for review
        required: true
        default: "40"
  push:
    branches: [main]
    paths:
      - "LICENSES.md"
      - "README.md"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

# Keep only the newest Pilot v3.1 validation run active for this branch.
concurrency:
  group: pilot-v3.1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official source URLs (HEAD only)
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local source="$1"
            local url="$2"
            shift 2
            echo "HEAD check: ${source}: ${url}"
            if ! curl --fail --silent --head --location "$@" "${url}" >/dev/null; then
              echo "::warning title=Source unreachable::${source} URL is unreachable from this GitHub Actions runner: ${url}"
              return 0
            fi
            echo "HEAD OK: ${source}"
          }
          check_url "Lexique 3.83" "https://www.lexique.org/databases/Lexique383/Lexique383.tsv" --connect-timeout 10 --max-time 25
          check_url "Dicollecte/Grammalecte 7.7" "https://www.grammalecte.net/dic/hunspell-french-dictionaries-v7.7.zip" --connect-timeout 10 --max-time 25
          check_url "Lefff 2.1" "https://www.labri.fr/perso/clement/lefff/public/data/lefff-2.1.txt.gz" --connect-timeout 10 --max-time 25
      - name: Download official source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw data
          echo "Downloading Lexique 3.83: https://www.lexique.org/databases/Lexique383/Lexique383.tsv"
          curl --fail --location --show-error --connect-timeout 10 --max-time 25 --output data/raw/Lexique383.tsv "https://www.lexique.org/databases/Lexique383/Lexique383.tsv"
          echo "Downloading Dicollecte/Grammalecte 7.7: https://www.grammalecte.net/dic/hunspell-french-dictionaries-v7.7.zip"
          curl --fail --location --show-error --connect-timeout 10 --max-time 25 --output data/raw/hunspell-french-dictionaries-v7.7.zip "https://www.grammalecte.net/dic/hunspell-french-dictionaries-v7.7.zip"
      - name: Install Hunspell and extract Dicollecte dictionary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes hunspell unzip
          mkdir -p data/raw/dicollecte
          unzip -oq data/raw/hunspell-french-dictionaries-v7.7.zip -d data/raw/dicollecte
          test -f data/raw/dicollecte/fr-toutesvariantes.dic
          test -f data/raw/dicollecte/fr-toutesvariantes.aff
      - name: Download optional Lefff cross-check
        id: download-lefff
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p data/raw
          rm -f data/raw/lefff-2.1.txt.gz data/raw/lefff-download-error.txt data/raw/lefff-download-status.txt
          echo "Downloading optional Lefff 2.1 cross-check: https://www.labri.fr/perso/clement/lefff/public/data/lefff-2.1.txt.gz"
          if curl --fail --location --show-error --connect-timeout 5 --max-time 15 --retry 0 --output data/raw/lefff-2.1.txt.gz "https://www.labri.fr/perso/clement/lefff/public/data/lefff-2.1.txt.gz" 2>data/raw/lefff-download-error.txt; then
            rm -f data/raw/lefff-download-error.txt
            echo "Lefff download available."
          else
            status=$?
            rm -f data/raw/lefff-2.1.txt.gz
            error="$(tr '\n' ' ' < data/raw/lefff-download-error.txt | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//')"
            printf 'Lefff download unavailable: %s\n' "${error:-curl exited with status ${status}}" > data/raw/lefff-download-status.txt
            echo "::warning title=Lefff unavailable::$(cat data/raw/lefff-download-status.txt)"
            exit "$status"
          fi
      - name: Build Lexique-only pilot and optional cross-checks
        env:
          PRINT_RANDOM: ${{ github.event.inputs.print_random || '40' }}
        run: python scripts/import_pilot.py --print-random "$PRINT_RANDOM"
      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Generate and validate French teacher workbook
        run: python scripts/generate_review_xlsx.py
      - name: Defer generated artifact commit until diagnostics finish
        if: always()
        run: echo "Generated artifacts and diagnostics will be committed together at the end of this run."
      - name: Write source diagnostics (always)
        if: always()
        continue-on-error: true
        run: python scripts/diagnostics.py
      - name: Fail the job when Pilot v3.1 assertions fail
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          path = Path("diagnostics/last-run.txt")
          if not path.exists():
              print("Assertion gate failed: diagnostics/last-run.txt missing")
              sys.exit(1)
          text = path.read_text(encoding="utf-8", errors="strict")
          lines = [line for line in text.splitlines() if line.startswith("ASSERT ")]
          if len(lines) != 14 or any(not any(line.startswith(f"ASSERT {letter}: ") for line in lines) for letter in "abcdefghijklmn"):
              print("Assertion gate failed: fourteen assertion lines are not present")
              sys.exit(1)
          failed = [line for line in lines if ": FAIL" in line]
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          if any(": PASS" not in line for line in lines):
              print("Assertion gate failed: unexpected assertion status")
              sys.exit(1)
          print("Pilot v3.1 assertion gate: PASS (14/14)")
          PY
      - name: Commit last-run diagnostics (always)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          if [ ! -f diagnostics/last-run.txt ]; then
            mkdir -p diagnostics
            printf '%s\n' "Diagnostics generator did not produce diagnostics/last-run.txt; inspect the workflow logs." > diagnostics/last-run.txt
          fi
          git add data/pilot-300.json data/cross-checks-300.json data/source-checksums.json data/ambiguous-forms.json data/review-sheet.md data/review-sheet.csv data/review-sheet.xlsx data/teacher-override-results.json diagnostics/last-run.txt
          if git diff --cached --quiet; then
            echo "Generated artifacts and diagnostics are unchanged."
          else
            git commit -m "Record French teacher review artifacts and diagnostics"
            git push
          fi
