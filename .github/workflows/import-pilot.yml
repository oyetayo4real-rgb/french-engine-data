name: Import and validate 300-entry pilot

on:
  workflow_dispatch:
    inputs:
      print_random:
        description: Number of random entries to print for review
        required: true
        default: "40"
  push:
    branches: [main]
    paths:
      - "LICENSES.md"
      - "README.md"
      - "scripts/import_pilot.py"
      - "scripts/diagnostics.py"
      - ".github/workflows/import-pilot.yml"

permissions:
  contents: write

jobs:
  import-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official source URLs (HEAD only)
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local source="$1"
            local url="$2"
            echo "HEAD check: ${source}: ${url}"
            if ! curl --fail --silent --head --location "${url}" >/dev/null; then
              echo "::warning title=Source unreachable::${source} URL is unreachable from this GitHub Actions runner: ${url}"
              return 0
            fi
            echo "HEAD OK: ${source}"
          }
          check_url "Lexique 3.83" "https://www.lexique.org/databases/Lexique383/Lexique383.tsv"
          check_url "Dicollecte/Grammalecte 7.7" "https://www.grammalecte.net/dic/hunspell-french-dictionaries-v7.7.zip"
          check_url "Lefff 2.1" "https://www.labri.fr/perso/clement/lefff/public/data/lefff-2.1.txt.gz"
      - name: Download official source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw data
          echo "Downloading Lexique 3.83: https://www.lexique.org/databases/Lexique383/Lexique383.tsv"
          curl --fail --location --show-error --retry 3 --output data/raw/Lexique383.tsv "https://www.lexique.org/databases/Lexique383/Lexique383.tsv"
          echo "Downloading Dicollecte/Grammalecte 7.7: https://www.grammalecte.net/dic/hunspell-french-dictionaries-v7.7.zip"
          curl --fail --location --show-error --retry 3 --output data/raw/hunspell-french-dictionaries-v7.7.zip "https://www.grammalecte.net/dic/hunspell-french-dictionaries-v7.7.zip"
          echo "Downloading Lefff 2.1: https://www.labri.fr/perso/clement/lefff/public/data/lefff-2.1.txt.gz"
          curl --fail --location --show-error --retry 3 --output data/raw/lefff-2.1.txt.gz "https://www.labri.fr/perso/clement/lefff/public/data/lefff-2.1.txt.gz"
      - name: Build Lexique-only pilot and optional cross-checks
        env:
          PRINT_RANDOM: ${{ github.event.inputs.print_random || '40' }}
        run: python scripts/import_pilot.py --print-random "$PRINT_RANDOM"
      - name: Commit pilot, cross-checks, and checksum manifest
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pilot-300.json data/cross-checks-300.json data/source-checksums.json
          if git diff --cached --quiet; then
            echo "Pilot, cross-checks, and checksum manifest are unchanged."
          else
            git commit -m "Import Lexique-only pilot and source cross-check evidence"
            git push
          fi
      - name: Write source diagnostics (always)
        if: always()
        continue-on-error: true
        run: python scripts/diagnostics.py
      - name: Commit last-run diagnostics (always)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f diagnostics/last-run.txt ]; then
            mkdir -p diagnostics
            printf '%s\n' "Diagnostics generator did not produce diagnostics/last-run.txt; inspect the workflow logs." > diagnostics/last-run.txt
          fi
          git add diagnostics/last-run.txt
          if git diff --cached --quiet; then
            echo "Diagnostics file is unchanged."
          else
            git commit -m "Record source and pilot diagnostics [skip ci]"
            git push
          fi
